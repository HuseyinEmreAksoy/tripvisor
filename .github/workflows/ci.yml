name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel any in-progress run on the same branch when a new commit is pushed.
# Keeps PR CI cheap and avoids stale green checks on outdated commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI posture (v2 Phase 0.5f): with test-specialist disabled, this workflow IS the
# regression net. The Jest job is the required check and MUST stay green through
# the v2 S1 SDK epic (bump jest-expo in lockstep at each SDK checkpoint).
# The tsc job below is continue-on-error (pre-existing typing debt) — the
# documented tsc baseline in docs/v2/conventions.md is the working gate until
# the debt is paid and continue-on-error is removed.
# TODO(v2 post-GA): add Playwright job once a CI Supabase fixture exists
# (e2e re-enablement is tracked in the BUILD-LOG debt register, not phase-6 —
# that referred to the old v1 numbering).

jobs:
  test:
    name: Jest (node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint is expected to exist in this repo, but guard so CI does not hard-fail
      # if the script is ever removed or renamed. We still want the job to run tests.
      - name: Lint (soft)
        run: |
          if [ -x node_modules/.bin/eslint ] && npm run | grep -qE '^\s*lint\s*$'; then
            npm run lint
          else
            echo "::warning::eslint or the 'lint' npm script is missing — skipping lint."
          fi

      # Coverage thresholds are enforced inside jest.config (Step 5.5). Here we
      # just need the suite to pass with coverage collection enabled.
      - name: Jest (with coverage)
        run: npm test -- --coverage --ci --maxWorkers=2

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  deno:
    name: Deno (edge functions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Cache Deno modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('supabase/functions/**/*.ts') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # Let Deno walk the directory itself rather than relying on bash glob
      # expansion (`**` in non-globstar bash matches one level only and would
      # silently skip nested test files — a green-but-empty CI run).
      - name: Deno test (with coverage)
        run: deno test --allow-net --allow-env --allow-read --coverage=cov_profile supabase/functions/

      - name: Deno coverage summary
        if: always()
        run: deno coverage cov_profile

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Temporarily lenient: the repo carries pre-existing `any` / typing debt
      # tracked as Phase 4 Problem 10. Once that is paid down, remove
      # `continue-on-error` so typecheck becomes a required signal.
      - name: tsc --noEmit
        continue-on-error: true
        run: npx tsc --noEmit
